{{- $skills := split (.Inner | strings.TrimSpace) "|" -}}
<div class="not-prose my-6 flex flex-wrap" style="column-gap: 1.25rem; row-gap: 0.75rem;" aria-label="Areas of Expertise">
  {{- range $skills }}
    {{- $skill := strings.TrimSpace . -}}
    {{- with $skill }}
      <span class="skill-pill rounded-full border px-3 py-1 text-sm font-medium">{{ . }}</span>
    {{- end }}
  {{- end }}
</div>
