<div class="not-prose mb-6 flex items-center">
  {{ with resources.Get "img/tim-mccallum-profile.png" }}
    {{ partial "picture.html" (dict
      "img" .
      "alt" "Tim McCallum"
      "class" "me-4 h-auto w-24 rounded-full"
      "lazy" false
      "webp" true
    ) }}
  {{ end }}
  <div>
    <div class="text-2xl">
      {{ .Inner | markdownify }}
    </div>
    <div class="mt-1 text-2xl">
      {{ partial "author-links.html" . }}
    </div>
  </div>
</div>
